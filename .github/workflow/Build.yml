name: Build dplayx.dll

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc mingw-w64-i686-cmake mingw-w64-i686-make unzip

      - name: Unzip and Build
        run: |
          unzip -o *.zip
          ls -la
          cd */
          ls -la
          mkdir build
          cd build
          cmake -G "MinGW Makefiles" ..
          mingw32-make

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dplayx-dll
          path: "**/dplayx.dll"
